# SonarQube project settings (read automatically by sonar-scanner)
sonar.projectKey=node-sonar-ci
sonar.projectName=node-sonar-ci
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,coverage/**

# Coverage report produced by "npm test" (jest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
